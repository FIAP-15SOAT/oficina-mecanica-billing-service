# Every billing Secret. Each CD step selects its own document with
# `yq 'select(.metadata.name == "<name>")'`, fills the placeholders and applies it
# through stdin. Values go in `data:` (base64 on a single line) because the
# multiline public key PEM would break the YAML in a `stringData` rendered by envsubst.
apiVersion: v1
kind: Secret
metadata:
  name: jwt-public-keys
  namespace: billing
  labels:
    app.kubernetes.io/name: billing-service
    app.kubernetes.io/part-of: oficina-mecanica
type: Opaque
data:
  STAFF_JWT_PUBLIC_KEY: ${STAFF_JWT_PUBLIC_KEY_B64}
  STAFF_JWT_KEY_ID: ${STAFF_JWT_KEY_ID_B64}
---
# Built by the CD from the RDS endpoint and the managed secret (AWSCURRENT).
apiVersion: v1
kind: Secret
metadata:
  name: database-credentials
  namespace: billing
  labels:
    app.kubernetes.io/name: billing-service
    app.kubernetes.io/part-of: oficina-mecanica
type: Opaque
data:
  DATABASE_URL: ${DATABASE_URL_B64}
---
# Built by the CD from the ElastiCache endpoint and the auth token secret.
apiVersion: v1
kind: Secret
metadata:
  name: cache-credentials
  namespace: billing
  labels:
    app.kubernetes.io/name: billing-service
    app.kubernetes.io/part-of: oficina-mecanica
type: Opaque
data:
  CACHE_URL: ${CACHE_URL_B64}
---
# Filled by the CD from the repository secrets of the production environment.
apiVersion: v1
kind: Secret
metadata:
  name: mercadopago
  namespace: billing
  labels:
    app.kubernetes.io/name: billing-service
    app.kubernetes.io/part-of: oficina-mecanica
type: Opaque
data:
  MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN_B64}
  MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET_B64}
