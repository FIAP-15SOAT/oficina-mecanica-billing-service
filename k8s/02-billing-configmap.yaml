apiVersion: v1
kind: ConfigMap
metadata:
  name: billing-config
  namespace: billing
  labels:
    app.kubernetes.io/name: billing-service
    app.kubernetes.io/part-of: oficina-mecanica
data:
  NODE_ENV: production
  PORT: "3000"
  STAFF_JWT_ISSUER: "oficina-identity"
  STAFF_JWT_AUDIENCE: "oficina-services"
  TZ: "America/Sao_Paulo"
  LOG_LEVEL: "info"
  OTEL_SERVICE_NAME: "oficina-mecanica-billing-service"
  OTEL_SERVICE_NAMESPACE: "oficina-mecanica"
  TRUSTED_PROXY_CIDRS: ""
  AWS_REGION: "us-east-1"
  BILLING_QUEUE_NAME: "billing.fifo"
  # SNS does not resolve an ARN by name: the CD renders it with the account from `aws sts get-caller-identity`.
  MESSAGING_TOPIC_ARN: "${MESSAGING_TOPIC_ARN}"
  CACHE_TTL_SECONDS: "43200"
  OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT}"
  OTEL_LOGS_EXPORTER: "none"
  OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: "delta"
